<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ghost OS</title>
    <style>
      :root {
        --glow-color: rgba(255, 255, 255, 0.35);
      }

      body {
        background: #0a0a0c;
        color: white;
        font-family: monospace;
        margin: 0;
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
      }

      /* ----------------------------- */
      /* DRAG REGION FIX               */
      /* ----------------------------- */

      .titlebar {
        -webkit-app-region: drag;
        text-align: center;
        margin-bottom: 10px;
      }

      .titlebar h1 {
        margin: 0;
        padding: 0;
        font-size: 24px;
        font-weight: bold;
        -webkit-app-region: drag;
      }

      /* Everything else must NOT drag */
      .ghost-container * {
        -webkit-app-region: no-drag;
      }

      /* ----------------------------- */
      /* MAIN UI CONTAINER             */
      /* ----------------------------- */

      .ghost-container {
        position: relative;
        z-index: 2;

        padding: 20px;
        border-radius: 16px;

        backdrop-filter: blur(0.5px);
        background: rgba(0, 0, 0, 0.03);

        box-shadow: 0 0 30px var(--glow-color);

        text-align: center;

        max-height: 82vh;
        overflow-y: auto;
      }

      #ghost-state {
        margin-top: 10px;
        font-size: 20px;
        color: #ffffff;
        opacity: 0.9;
      }

      #ghost-voice {
        margin-top: 10px;
        font-size: 18px;
        opacity: 0.8;
      }

      #attention-bars {
        display: flex;
        gap: 4px;
        min-height: 100px;
        height: 100px;
        margin-top: 12px;
        justify-content: center;
        align-items: flex-end;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 6px;
        border-radius: 6px;
      }

      .attention-bar {
        width: 1px;
        background: #ffaa00;
        transition: height 0.25s ease;
      }

      #latent-visualizer {
        display: flex;
        gap: 4px;
        margin-top: 20px;
        height: 120px;
        align-items: flex-end;
        justify-content: center;
      }

      .latent-bar {
        width: 8px;
        background: #00ffff55;
        transition: height 0.25s ease;
      }

      #loss-display,
      #prediction-loss,
      #anomaly-display {
        margin-top: 10px;
        font-size: 18px;
        color: #00ffff;
      }

      #latent-3d-container {
        margin-top: 16px;
        display: flex;
        gap: 16px;
        justify-content: center;
      }

      .latent-layer {
        display: grid;
        grid-template-columns: repeat(4, 14px);
        grid-auto-rows: 14px;
        gap: 4px;

        position: relative;
        z-index: 0 !important;
        pointer-events: none;
      }

      .latent-cell {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: rgba(0, 255, 255, 0.2);
      }

      #latent-history {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 160px;
        overflow: hidden;
      }

      .history-row {
        display: flex;
        gap: 2px;
      }

      .history-cell {
        width: 6px;
        height: 6px;
        background: rgba(0, 255, 255, 0.2);
      }

      #status-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin-top: 12px;
        font-size: 14px;
        opacity: 0.85;
      }

      .status-block {
        min-width: 160px;
      }

      .status-label {
        font-weight: bold;
        font-size: 13px;
        margin-bottom: 4px;
        display: block;
        color: #a0ffff;
      }

      .status-line {
        margin: 2px 0;
      }
    </style>
  </head>

  <body>
    <div class="ghost-container">

      <!-- DRAGGABLE TITLEBAR -->
      <div class="titlebar">
        <h1>The Ghost Stirs...</h1>
      </div>

      <div id="ghost-state"></div>

      <div id="attention-bars"></div>

      <div id="status-row">
        <div class="status-block">
          <span class="status-label">Emotional tell</span>
          <div class="status-line">
            Emotion: <span id="emotion-label">neutral</span>
          </div>
          <div class="status-line">
            Valence: <span id="emotion-valence">0.00</span>
          </div>
          <div class="status-line">
            Arousal: <span id="emotion-arousal">0.00</span>
          </div>
          <div class="status-line">
            Tension: <span id="emotion-tension">0.00</span>
          </div>
        </div>

        <div class="status-block">
          <span class="status-label">Memory & mood</span>
          <div class="status-line">
            Episodes:
            <span id="memory-count">0</span>/<span id="memory-limit">0</span>
          </div>
          <div class="status-line">
            Mood baseline: <span id="mood-baseline">0.00</span>
          </div>
          <div class="status-line">
            Curiosity: <span id="trait-curiosity">0.00</span>
          </div>
          <div class="status-line">
            Emotionality: <span id="trait-emotionality">0.00</span>
          </div>
        </div>
      </div>

      <div id="latent-visualizer"></div>
      <div id="loss-display"></div>
      <div id="prediction-loss"></div>
      <div id="anomaly-display"></div>
      <div id="latent-3d-container"></div>
      <div id="latent-history"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
