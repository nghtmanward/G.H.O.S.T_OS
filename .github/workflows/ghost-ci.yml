name: Ghost_OS CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: npm install

    - name: Build Electron app (no packaging)
      run: npm run build --if-present

    - name: Run Ghost_OS tests (placeholder)
      run: |
        echo "Ghost_OS test suite not implemented yet"
        echo "Add tests in /core, /memory, or /datasets and update this step"
